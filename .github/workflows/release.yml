name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    # Keep v143 paired with the VS 2022 MFC headers and libraries.
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: x64
            output_dir: Release_x64
          - name: x86
            platform: Win32
            output_dir: Release_x32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Build WinMTR
        shell: pwsh
        run: |
          msbuild src\WinMTR.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /m

      - name: Package WinMTR
        shell: pwsh
        run: |
          $packageRoot = "dist\WinMTR-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          Copy-Item "src\${{ matrix.output_dir }}\WinMTR.exe" "$packageRoot\WinMTR.exe"
          Copy-Item "README.md" "$packageRoot\README.md"
          Copy-Item "LICENSE" "$packageRoot\LICENSE"

          Compress-Archive `
            -Path "$packageRoot\*" `
            -DestinationPath "dist\WinMTR-${{ matrix.name }}.zip" `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinMTR-${{ matrix.name }}
          path: dist/WinMTR-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish main build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Main build ${{ github.run_number }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publish versioned release assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
